name: MiKTeX Linux

# MiKTeX backend (M9) on Linux: Dockerfile.miktex (complete MiKTeX: slow), the image cached in
# GHCR. Manual trigger only; workflow_dispatch needs this file on the default branch.
on:
  workflow_dispatch:

jobs:
  linux-miktex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # the MiKTeX image in GHCR
    steps:
      - uses: actions/checkout@v4
      # the image is about 7.6 GB packed and 11 GB unpacked; a runner has about 14 GB free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: MiKTeX image (from GHCR, else build and publish)
        # as the TeX Live image in ci.yml: tagged by the hash of its inputs, built once
        env:
          TAG: ${{ hashFiles('Dockerfile.miktex', 'requirements-dev.txt') }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/latex-chapmk-miktex:$TAG"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull -q "$image"; then
            docker tag "$image" chapmk-miktex
          else
            docker build -f Dockerfile.miktex -t chapmk-miktex .
            docker tag chapmk-miktex "$image"
            docker push -q "$image" || echo "::warning::could not publish $image (no package permission)"
          fi
      - name: Reference cache key
        # the references depend on the TeX installation (the image itself: rebuilt under the same
        # tag it has newer packages) and the full-mode code (tests/conftest.py, FULL_MODE_CODE;
        # keep in sync with ci.yml)
        id: refs
        run: |
          echo "image=$(docker image inspect -f '{{.Id}}' chapmk-miktex | cut -d: -f2 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "code=${{ hashFiles('tests/conftest.py', 'src/chapmk/fullbuild.py', 'src/chapmk/gensrc.py', 'src/chapmk/texdist.py', 'src/chapmk/pictures.py', 'src/chapmk/synctex.py', 'src/chapmk/publish.py', 'src/chapmk/tools.py', 'src/chapmk/tex/chapmk-ini.sty') }}" >> "$GITHUB_OUTPUT"
      - name: Reference cache
        # .test-cache: --full and latexmk references, restored from the latest run with the same
        # image and code (as in ci.yml); writable for the container's users
        uses: actions/cache@v4
        with:
          path: .test-cache
          key: miktex-refs-${{ steps.refs.outputs.image }}-${{ steps.refs.outputs.code }}-${{ github.run_id }}
          restore-keys: miktex-refs-${{ steps.refs.outputs.image }}-${{ steps.refs.outputs.code }}-
      - name: Smoke test (corpora with latexmk, biber, makeindex, synctex, mylatexformat)
        run: docker run --rm -v "$PWD":/work:ro chapmk-miktex bash /work/tests/miktex-smoke.sh
      # as root and as the image's user: MiKTeX run as root warns on stderr ("security risk:
      # running with elevated privileges") and keeps its user data in /root/.miktex; the
      # repository is copied, as the image's user cannot write the runner's checkout. The
      # reference cache .test-cache is mounted writable for both (the second run reuses the
      # references of the first)
      - name: Reference cache writable in the container
        run: mkdir -p .test-cache miktex-logs && chmod 777 .test-cache miktex-logs
      - name: Lint, type-check, all tests as root (slow, scenario, acceptance)
        run: |
          docker run --rm -v "$PWD":/work:ro -v "$PWD/.test-cache":/cache -v "$PWD/miktex-logs":/logs --user root chapmk-miktex bash -c '
            set -e
            # the logs of MiKTeX (format and font making, package database), kept for the upload
            trap "cp -r $HOME/.miktex/texmfs/data/miktex/log /logs/$(id -un) 2>/dev/null || true" EXIT
            w=$(mktemp -d); tar -C /work --exclude=./.test-cache -cf - . | tar -C "$w" -xf -
            ln -s /cache "$w/.test-cache"; cd "$w"
            # pdflatex.fmt before the tests: MiKTeX makes it at first use, and a test that
            # recorded it before a parallel test made it again builds cold
            initexmf --dump=pdflatex >/dev/null
            pip install -e .
            ruff check . && ruff format --check .
            mypy --strict src
            pytest -n auto --dist worksteal
          '
      - name: All tests as non-root user (slow, scenario, acceptance)
        if: success() || failure()
        run: |
          docker run --rm -v "$PWD":/work:ro -v "$PWD/.test-cache":/cache -v "$PWD/miktex-logs":/logs chapmk-miktex bash -c '
            set -e
            # the logs of MiKTeX (format and font making, package database), kept for the upload
            trap "cp -r $HOME/.miktex/texmfs/data/miktex/log /logs/$(id -un) 2>/dev/null || true" EXIT
            w=$(mktemp -d); tar -C /work --exclude=./.test-cache -cf - . | tar -C "$w" -xf -
            ln -s /cache "$w/.test-cache"; cd "$w"
            # pdflatex.fmt before the tests: MiKTeX makes it at first use, and a test that
            # recorded it before a parallel test made it again builds cold
            initexmf --dump=pdflatex >/dev/null
            pip install -q -e .
            pytest -n auto --dist worksteal
          '
      - name: MiKTeX logs (format and font making, package database)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miktex-logs-linux
          path: miktex-logs/
          if-no-files-found: ignore
