name: Feature request
description: A package, document structure or workflow chapmk should support
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need, and why?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A minimal document or a short description of the structure (no private content).
