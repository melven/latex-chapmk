[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-chapmk"
dynamic = ["version"]
description = "Incremental, parallel pdfLaTeX builds for documents split with \\include"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Melven Roehrig-Zoellner" }]
requires-python = ">=3.11"
dependencies = ["pikepdf>=10"]
keywords = ["latex", "pdflatex", "latexmk", "build", "incremental", "include", "synctex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/melven/latex-chapmk"
Issues = "https://github.com/melven/latex-chapmk/issues"
Changelog = "https://github.com/melven/latex-chapmk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chapmk = "chapmk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chapmk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chapmk = ["tex/*.sty", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/slow", "tests/acceptance", "tests/scenarios", "tests/bench"]
markers = [
    "slow: runs TeX",
    "acceptance: compares against a reference build (design §3.3)",
    "bench: manual benchmarks only",
]
addopts = "-m 'not bench'"

[tool.coverage.run]
source = ["chapmk"]
branch = true
omit = ["*/chapmk/__main__.py"]

[tool.coverage.report]
# CI floor (T3): the full suite measured 94 % (branch) at 0.9
fail_under = 90
show_missing = false
skip_covered = true
